# Local overrides for building/serving without the remote-theme plugin.
# Usage: bundle exec jekyll serve --source docs --config _config.yml,_config_local.yml
theme: just-the-docs
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

defaults:
  - scope:
      path: ""
    values:
      layout: "default"